
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>IZO 萬粉健康應援祭｜分享好友</title>

  <!-- LINE LIFF SDK -->
  <script
    src="https://static.line-scdn.net/liff/edge/2/sdk.js">
  </script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f3f7fa;
      color: #22374c;
      text-align: center;
    }

    .container {
      max-width: 430px;
      margin: 40px auto;
      padding: 30px 22px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 6px 22px #22374c14;
    }

    h1 { font-size: 25px; }
    p { line-height: 1.8; }

    .share-btn {
      display: block;
      width: 100%;
      background: #06c755;
      color: white;
      border: none;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 25px;
    }

    .share-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      margin-top: 18px;
      font-size: 14px;
      white-space: pre-line;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>萬粉健康應援祭</h1>
    <p>
      邀請好友一起參加！<br>
      健康好禮週週抽<br>
      挑戰萬粉終極大獎
    </p>

    <button
      id="shareBtn"
      class="share-btn"
      onclick="shareToFriends()"
      disabled>
      初始化中...
    </button>

    <div id="status" role="status" aria-live="polite">
      正在連線 LINE...
    </div>
  </main>

  <script>
    // ===== 請修改以下設定 =====

    const LIFF_ID = "YOUR_LIFF_ID";

    // 換成真正公開的活動網址
    const ACTIVITY_URL = "https://example.com/campaign";

    // ===== LIFF 初始化 =====

    const shareBtn = document.getElementById("shareBtn");
    const statusEl = document.getElementById("status");

    let initialized = false;

    function setStatus(message) {
      statusEl.textContent = message;
    }

    async function initializeLIFF() {
      try {
        await liff.init({ liffId: LIFF_ID });
        initialized = true;

        // 外部瀏覽器需登入 LINE
        if (!liff.isLoggedIn()) {
          shareBtn.disabled = false;
          shareBtn.textContent = "使用 LINE 登入";
          setStatus("請先登入 LINE");
          return;
        }

        // 檢查 Share Target Picker 是否可用
        if (!liff.isApiAvailable("shareTargetPicker")) {
          shareBtn.disabled = true;
          shareBtn.textContent = "目前無法分享";
          setStatus("此環境不支援 LINE 好友分享功能");
          return;
        }

        shareBtn.disabled = false;
        shareBtn.textContent = "分享給 LINE 好友";
        setStatus("已準備完成，請點擊分享");

      } catch (error) {
        console.error("LIFF 初始化失敗", error);
        setStatus("LIFF 初始化失敗：" + error.message);
        shareBtn.textContent = "初始化失敗";
      }
    }

    // ===== Flex Message 卡片 =====

    function createFlexMessage() {
      return {
        type: "flex",
        altText: "IZO 萬粉健康應援祭，邀請你一起參加！",
        contents: {
          type: "bubble",
          size: "mega",
          header: {
            type: "box",
            layout: "vertical",
            backgroundColor: "#22374C",
            paddingAll: "22px",
            contents: [
              {
                type: "text",
                text: "IZO 昊霖預防醫學機構",
                color: "#A9DEFA",
                size: "sm"
              },
              {
                type: "text",
                text: "萬粉健康應援祭",
                weight: "bold",
                size: "xl",
                color: "#FFFFFF",
                margin: "md",
                wrap: true
              },
              {
                type: "text",
                text: "健康好禮週週抽！",
                color: "#FFFFFF",
                size: "md",
                margin: "sm"
              }
            ]
          },

          body: {
            type: "box",
            layout: "vertical",
            paddingAll: "22px",
            spacing: "md",
            contents: [
              {
                type: "text",
                text: "每週抽出 3 位幸運兒",
                size: "lg",
                weight: "bold",
                color: "#22374C"
              },
              {
                type: "text",
                text: "邀請好友一起參加健康互動活動，挑戰 10,000 粉絲終極大獎！",
                size: "sm",
                wrap: true,
                color: "#555555"
              },
              {
                type: "separator",
                margin: "md"
              },
              {
                type: "text",
                text: "每週健康主題 × 好友互動 × 抽獎好禮",
                size: "sm",
                wrap: true,
                color: "#218EC9"
              }
            ]
          },

          footer: {
            type: "box",
            layout: "vertical",
            paddingAll: "15px",
            contents: [
              {
                type: "button",
                style: "primary",
                color: "#06C755",
                action: {
                  type: "uri",
                  label: "立即參加活動",
                  uri: ACTIVITY_URL
                }
              }
            ]
          }
        }
      };
    }

    // ===== 一鍵分享好友 =====

    async function shareToFriends() {
      if (!initialized) {
        setStatus("LINE 尚未初始化");
        return;
      }

      if (!liff.isLoggedIn()) {
        liff.login({ redirectUri: window.location.href });
        return;
      }

      if (!liff.isApiAvailable("shareTargetPicker")) {
        setStatus("此環境不支援分享功能");
        return;
      }

      shareBtn.disabled = true;
      setStatus("正在開啟好友選擇介面...");

      try {
        const result = await liff.shareTargetPicker(
          [createFlexMessage()],
          { isMultiple: true }
        );

        if (result) {
          setStatus("已完成 LINE 分享流程");
        } else {
          setStatus("分享視窗已關閉，請確認是否送出");
        }

      } catch (error) {
        console.error("分享失敗", error);
        setStatus("分享失敗：" + error.message);
      } finally {
        shareBtn.disabled = false;
      }
    }

    // 開啟頁面後初始化
    initializeLIFF();
  </script>
</body>
</html>
